[package]
name = "emunest-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
emunest-emulators = { version = "0.1.0", path = "../emulators" }
reqwest = { version = "0.13.5", features = ["blocking"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust = "0.6.1"
sha2 = "0.11.1"
toml = "1.2.2"
tracing = "0.1.44"
walkdir = "2.5.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
