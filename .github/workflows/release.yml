name: Release
# Chaque push sur master publie une nouvelle version 0.1.<n° d'exécution> (zip portable + installeur) :
# EmuNest, installé, la trouve et se met à jour tout seul. Une étiquette vX.Y.Z poussée à la main publie cette version.
# Lancement manuel : construit les fichiers en artefacts, sans publier.
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['**.md', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/v*') { $v = "${{ github.ref_name }}".TrimStart('v') } else { $v = "0.1.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          # la version affichée et comparée par la mise à jour automatique vient de Cargo.toml
          (Get-Content app/Cargo.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content app/Cargo.toml
      - run: cargo build --release -p emunest
      - name: Zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/emunest.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "EmuNest-${{ steps.ver.outputs.tag }}-windows-x64.zip"
      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\emunest.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: emunest-windows
          path: |
            EmuNest-*.zip
            installer/Output/EmuNest-Setup-*.exe
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'workflow_dispatch'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            EmuNest-*.zip
            installer/Output/EmuNest-Setup-*.exe
          generate_release_notes: true
